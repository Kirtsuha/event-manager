server:
  port: 8081

spring:
  application:
    name: event-notificator

  datasource:
    url: jdbc:postgresql://localhost:5433/event_notificator
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/changelog-master.yaml

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: event-notificator
      key-deserializer: org.apache.kafka.common.serialization.LongDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: dev.sorokin.eventcommon.EventChangedMessage

notifications:
  kafka:
    topic: event-changes
  cleanup:
    older-than-days: 7
    cron: "0 0 * * * *"

logging:
  level:
    root: INFO
    org.springframework.web: INFO

springdoc:
  swagger-ui:
    path: /swagger-ui/index.html
    url: /event-notificator-openapi.yaml

jwt:
  lifetime: 86400000
  secret-key: oYa85QCMCKssZ4OURAtCfOCCFcAxIb3hKhI8YPneGt1

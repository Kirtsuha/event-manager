databaseChangeLog:
  - changeSet:
      id: 0001-create-notification-event-payloads
      author: codex
      changes:
        - createTable:
            tableName: notification_event_payloads
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: message_id
                  type: uuid
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: event_type
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: event_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: occurred_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: owner_id
                  type: bigint
              - column:
                  name: changed_by_id
                  type: bigint
              - column:
                  name: payload_json
                  type: jsonb
                  constraints:
                    nullable: false

  - changeSet:
      id: 0002-create-notifications
      author: codex
      changes:
        - createTable:
            tableName: notifications
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: payload_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: is_read
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: read_at
                  type: timestamp with time zone
        - addForeignKeyConstraint:
            baseTableName: notifications
            baseColumnNames: payload_id
            referencedTableName: notification_event_payloads
            referencedColumnNames: id
            constraintName: fk_notifications_payload
            onDelete: CASCADE
        - createIndex:
            tableName: notifications
            indexName: idx_notifications_user_read_created
            columns:
              - column:
                  name: user_id
              - column:
                  name: is_read
              - column:
                  name: created_at
        - createIndex:
            tableName: notifications
            indexName: idx_notifications_payload_id
            columns:
              - column:
                  name: payload_id
